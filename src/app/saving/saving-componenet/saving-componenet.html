
<div class="toolbar" style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
  <button nz-button nzType="primary" nzSize="small" (click)="addNewSaving()">
    <i nz-icon nzType="plus" nzTheme="outline"></i>
    New Saving
  </button>

  <input
    nz-input
    placeholder="Search Employee ID"
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearchChange($event)"
    style="width: 320px;"
  />
  <input type="file" accept=".csv" (change)="handleChange($event)" style="margin-left:8px;" />

  <button nz-button nzType="primary" nzSize="small" [nzLoading]="uploading" (click)="uploadFile()">
    <i nz-icon nzType="upload"></i> Upload CSV
  </button>

  <button nz-button nzType="default" nzSize="small" (click)="reloadPage()">
    <i nz-icon nzType="reload"></i> Refresh
  </button>
</div>





<nz-table #usersTable
 [nzBordered]="true"
  [nzData]="saving" 
  [nzLoading]="loading" 
  [nzFrontPagination]="false"
  [nzPageSize]="pageSize"
  [nzPageSizeOptions]="[5,10,20,30,40,50]"
  nzShowSizeChanger
  nzShowPagination
  [nzTotal]="total"
 (nzPageIndexChange)="onPageChange($event)"
 (nzPageSizeChange)="onPageSizeChange($event)"
 >
  
  <thead>
    <tr style="background-color: rgb(45, 39, 134);">
      <th>Saving  ID</th>
      <th>Employee ID</th>
      <th>fullName</th>
      <th>CS</th>
      <th>CLR</th>
        <th>Actions</th>
    </tr>
  </thead>
  <tbody>  
    <tr *ngFor="let save of saving">
      <td>{{ save.id}}</td>
      <td>{{ save.employeeId }}</td>
      <td>{{ save.fullName }}</td>
      <td>{{ save.craSaving}}
      <td>{{save.crassLoanRepayment}}</td>
      <td>
  <button nz-button nzType="primary"  nzSize="small" (click)="getsavingById(save.employeeId)">
        <i nz-icon nzType="more"></i>Details</button>
        <button nz-button nzType="primary" nzDanger nzSize="small"  (click)="addNewSaving()">
          <i nz-icon nzType="delete"></i>Remove</button>
      </td>
    </tr>

  </tbody>
</nz-table>
