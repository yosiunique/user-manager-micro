
<nz-table #usersTable
 [nzBordered]="true"
  [nzData]="saving" 
  [nzLoading]="loading" 
  [nzFrontPagination]="false"
  [nzPageSize]="pageSize"
  [nzPageSizeOptions]="[5,10,20,30,40,50]"
  nzShowSizeChanger
  nzShowPagination
  [nzTotal]="total"
 (nzPageIndexChange)="onPageChange($event)"
 (nzPageSizeChange)="onPageSizeChange($event)"
 >
  
  <thead>
    <th (click)="addNewSaving()" ><button nz-button nzType="primary" nzSize="small"  ><i nz-icon nzType="plus" nzTheme="outline" ></i>New Saving </button> 
    <th>
        <div class="search-wrapper">
  <nz-input-group [nzSuffix]="suffixTemplate">
    <input nz-input placeholder="Search By Employee" [formControl]="searchControl" />
  </nz-input-group>
  <ng-template #suffixTemplate>
    <i nz-icon nzType="close-circle" nzTheme="fill" (click)="clear()" style="cursor: pointer;" *ngIf="searchControl.value"></i>
  </ng-template>
</div>

    </th>
    <th><th (click)="deleteAll()" ><button nz-button nzType="primary" nzDanger nzSize="small" ><i nz-icon nzType="delete" nzTheme="outline" ></i>Remove All</button> 
</th>
    <tr style="background-color: rgb(45, 39, 134);">
      <th>Saving  ID</th>
      <th>Employee ID</th>
      <th>fullName</th>
      <th>CS</th>
      <th>CLR</th>
        <th>Actions</th>
    </tr>
  </thead>
  <tbody>  
    <tr *ngFor="let save of saving">
      <td>{{ save.id}}</td>
      <td>{{ save.employeeId }}</td>
      <td>{{ save.fullName }}</td>
      <td>{{ save.craSaving}}
      <td>{{save.crassLoanRepayment}}</td>
      <td>
  <button nz-button nzType="primary"  nzSize="small" (click)="addNewSaving()">
        <i nz-icon nzType="details"></i>Update</button>
        <button nz-button nzType="primary" nzDanger nzSize="small"  (click)="deletebyId(save.id)">
          <i nz-icon nzType="delete"></i>Remove</button>
      </td>
    </tr>

  </tbody>
</nz-table>
