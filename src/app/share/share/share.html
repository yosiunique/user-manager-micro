<div class="share-container">

  <div class="header">
    <h2>Share Management</h2>
    <button nz-button nzType="primary" (click)="openDrawer()">
      <i nz-icon nzType="plus"></i> Add Share
    </button>
  </div>

  <!-- SHARE TABLE -->
  <nz-table [nzData]="shares" [nzLoading]="loading" nzBordered>
    <thead>
      <tr>
        <th>ID</th>
        <th>Employee ID</th>
        <th>Membership ID</th>
        <th>Full Name</th>
        <th>Total Saving</th>
        <th>No. of Share</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let share of shares">
        <td>{{ share.id }}</td>
        <td>{{ share.employeeId }}</td>
        <td>{{ share.membershipId }}</td>
        <td>{{ share.fullName }}</td>
        <td>{{ share.totalSaving }}</td>
        <td>{{ share.noOfShare }}</td>

        <td>
          <button nz-button nzType="link" (click)="openDrawer(share)">
            <i nz-icon nzType="edit"></i>
          </button>

          <button nz-button nzDanger nzType="text" (click)="deleteShare(share.id)">
            <i nz-icon nzType="delete"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>

  <!-- ======================================================
        SHARE DRAWER FORM
       ====================================================== -->
  <nz-drawer
    [nzVisible]="drawerVisible"
    nzPlacement="right"
    [nzWidth]="480"
    [nzTitle]="isEditMode ? 'Edit Share' : 'Add Share'"
    (nzOnClose)="closeDrawer()">

    <div class="drawer-content">

      <form nz-form *nzDrawerContent [formGroup]="shareForm">

        <nz-form-item>
          <nz-form-label nzRequired>Employee ID</nz-form-label>
          <nz-form-control>
            <input nz-input type="number" formControlName="employeeId">
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Membership ID</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="membershipId">
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Full Name</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="fullName">
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Total Saving</nz-form-label>
          <nz-form-control>
            <nz-input-number formControlName="totalSaving" style="width: 100%"></nz-input-number>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>No. of Share</nz-form-label>
          <nz-form-control>
            <nz-input-number formControlName="noOfShare" style="width: 100%"></nz-input-number>
          </nz-form-control>
        </nz-form-item>

        <div style="text-align: right; margin-top: 20px;">
          <button nz-button (click)="closeDrawer()">Cancel</button>
          <button nz-button nzType="primary" (click)="submitForm()">Save</button>
        </div>

      </form>

    </div>

  </nz-drawer>

</div>
