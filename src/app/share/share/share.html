<div class="share-container">

  <div class="header">
    <h2>Share Management</h2>
    <button nz-button nzType="primary" (click)="openDrawer()">
      <i nz-icon nzType="plus"></i> Add Share
    </button>
  </div>

  <!-- SHARE CARDS (Responsive Layout) -->
  <div class="share-cards-container">
    <nz-list [nzLoading]="loading" [nzGrid]="{ gutter: 16, xs: 24, sm: 12, md: 8, lg: 6, xl: 4 }">
      <nz-list-item *ngFor="let share of shares">
        <nz-card [nzBordered]="true" class="share-card" [nzActions]="[actionEdit, actionDelete]">
          <nz-card-meta [nzAvatar]="avatarTemplate" [nzTitle]="share.fullName"
            [nzDescription]="'Membership: ' + share.membershipId"></nz-card-meta>

          <div class="card-extra-content">
            <div class="info-row">
              <span class="label">Employee ID:</span>
              <span class="value">{{ share.employeeId }}</span>
            </div>
            <div class="info-row">
              <span class="label">Total Saving:</span>
              <span class="value">{{ share.totalSaving | number }}</span>
            </div>
            <div class="info-row highlight">
              <span class="label">Shares:</span>
              <span class="value">{{ share.noOfShare }}</span>
            </div>
          </div>

          <ng-template #avatarTemplate>
            <nz-avatar [nzIcon]="'pie-chart'" class="share-avatar"></nz-avatar>
          </ng-template>

          <ng-template #actionEdit>
            <span nz-icon nzType="edit" (click)="openDrawer(share)" nz-tooltip="Edit"></span>
          </ng-template>
          <ng-template #actionDelete>
            <span nz-icon nzType="delete" class="delete-icon" (click)="deleteShare(share.id)"
              nz-tooltip="Delete"></span>
          </ng-template>
        </nz-card>
      </nz-list-item>
    </nz-list>

    <div class="pagination-wrapper" *ngIf="total > 0">
      <nz-pagination [nzPageIndex]="pageIndex + 1" [nzTotal]="total" [nzPageSize]="pageSize"
        (nzPageIndexChange)="onPageChange($event)" (nzPageSizeChange)="onPageSizeChange($event)"
        nzShowSizeChanger></nz-pagination>
    </div>
  </div>

  <!-- ======================================================
        SHARE DRAWER FORM
       ====================================================== -->
  <nz-drawer [nzVisible]="drawerVisible" nzPlacement="right" [nzWidth]="'min(480px, 100vw)'"
    [nzTitle]="isEditMode ? 'Edit Share' : 'Add Share'" (nzOnClose)="closeDrawer()">


    <div class="drawer-content">

      <form nz-form *nzDrawerContent [formGroup]="shareForm">

        <nz-form-item>
          <nz-form-label nzRequired>Employee ID</nz-form-label>
          <nz-form-control>
            <input nz-input type="number" formControlName="employeeId">
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Membership ID</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="membershipId">
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label nzRequired>Full Name</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="fullName">
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>Total Saving</nz-form-label>
          <nz-form-control>
            <nz-input-number formControlName="totalSaving" style="width: 100%"></nz-input-number>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label>No. of Share</nz-form-label>
          <nz-form-control>
            <nz-input-number formControlName="noOfShare" style="width: 100%"></nz-input-number>
          </nz-form-control>
        </nz-form-item>

        <div style="text-align: right; margin-top: 20px;">
          <button nz-button (click)="closeDrawer()">Cancel</button>
          <button nz-button nzType="primary" (click)="submitForm()">Save</button>
        </div>

      </form>

    </div>

  </nz-drawer>

</div>
