<div class="employee-container">

  <div class="toolbar">
    <div class="toolbar-left">
      <button nz-button nzType="primary" (click)="openDrawer()">
        <i nz-icon nzType="plus"></i> Add Employee
      </button>
      <button nz-button nzType="primary" (click)="importCsv()">
        <i nz-icon nzType="upload"></i> Import Employee
      </button>
    </div>

    <div class="toolbar-center">
      <div class="search-wrapper">
        <nz-input-group [nzSuffix]="suffixButton" [nzPrefix]="prefixIcon" *ngIf="!isAdvancedSearch">
          <input nz-input placeholder="Search Employee ID..." 
                 [(ngModel)]="searchTerm" 
                 (keyup.enter)="onSearch()"
                 class="search-input" />
        </nz-input-group>
        <ng-template #prefixIcon><i nz-icon nzType="search"></i></ng-template>
        <ng-template #suffixButton>
          <button nz-button nzType="primary" nzSearch (click)="onSearch()">Search</button>
        </ng-template>

        <button nz-button nzType="link" (click)="toggleAdvancedSearch()">
          {{ isAdvancedSearch ? 'Hide' : 'Expand' }}
          <i nz-icon [nzType]="isAdvancedSearch ? 'up' : 'down'"></i>
        </button>
      </div>
    </div>

    <div class="toolbar-right">
      <button nz-button nzType="default" (click)="loadEmployees()">
        <i nz-icon nzType="reload"></i> Refresh
      </button>
    </div>
  </div>

  <div class="advanced-search-panel" *ngIf="isAdvancedSearch" style="margin-bottom: 20px; padding: 15px; background: #fafafa; border: 1px solid #f0f0f0; border-radius: 4px;">
    <div nz-row [nzGutter]="24">
      <div nz-col [nzXs]="24" [nzSm]="9">
        <label>Employee ID</label>
        <input nz-input placeholder="Enter Employee ID" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()" />
      </div>
      <div nz-col [nzXs]="24" [nzSm]="9">
        <label>Full Name</label>
        <input nz-input placeholder="Enter Full Name" [(ngModel)]="searchFullName" (keyup.enter)="onSearch()" />
      </div>
      <div nz-col [nzXs]="24" [nzSm]="6" style="display: flex; align-items: flex-end; gap: 8px; padding-bottom: 2px;">
        <button nz-button nzType="primary" (click)="onSearch()">
          <i nz-icon nzType="search"></i> Search
        </button>
        <button nz-button nzType="default" (click)="clearSearch()">
          <i nz-icon nzType="clear"></i> Reset
        </button>
      </div>
    </div>
  </div>

  <div class="desktop-view">
    <nz-table #employeeTable [nzData]="employees" [nzLoading]="loading" [nzFrontPagination]="false" [nzTotal]="total"
      [nzPageIndex]="pageIndex + 1" [nzPageSize]="pageSize" [nzPageSizeOptions]="[5,10,20,30,40,50]" nzShowSizeChanger
      (nzPageIndexChange)="onPageChange($event)" (nzPageSizeChange)="onPageSizeChange($event)"
      [nzScroll]="{ x: '1200px' }" [nzBordered]="true" nzSize="middle">
      <thead>
        <tr>
          <th nzWidth="100px">ID</th>
          <th nzWidth="150px">Employee ID</th>
          <th nzWidth="150px">Membership ID</th>
          <th nzLeft>Full Name</th>
          <th nzRight *ngIf="haveRole('Admin')">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let employee of employeeTable.data">
          <td>{{employee.id}}</td>
          <td>{{ employee.employeeId }}</td>
          <td>{{ employee.membershipId }}</td>
          <td nzLeft><strong>{{ employee.employeeFullName }}</strong></td>
          <td nzRight *ngIf="haveRole('Admin')">
            <div class="action-buttons">
              <button nz-button nzType="text" (click)="openDrawer(employee)" nz-tooltip="Edit">
                <i nz-icon nzType="edit" style="color: #1890ff;"></i>
              </button>
              <button nz-button nzType="text" (click)="deleteEmployee(employee.id)" nz-tooltip="Delete">
                <i nz-icon nzType="delete" style="color: #ff4d4f;"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </div>

  <div class="mobile-view">
    <div class="employee-cards-container">
      <nz-list [nzLoading]="loading" [nzGrid]="{ gutter: 16, xs: 24, sm: 12, md: 8, lg: 6, xl: 4 }">
        <nz-list-item *ngFor="let employee of employees">
          <nz-card [nzBordered]="true" class="employee-card" [nzActions]="haveRole('Admin') ? [actionEdit, actionDelete] : []">
            <nz-card-meta [nzAvatar]="avatarTemplate" [nzTitle]="employee.employeeFullName"
              [nzDescription]="'ID: ' + employee.employeeId"></nz-card-meta>
            <div class="card-extra-content">
              <div class="info-row">
                <span class="label"> Membership ID:</span>
                <span class="value">{{ employee.membershipId || 'Not found' }}</span>
              </div>
            </div>
            <ng-template #avatarTemplate>
              <nz-avatar [nzText]="employee.employeeFullName[0]" class="user-avatar"></nz-avatar>
            </ng-template>
            <ng-template #actionEdit>
              <span nz-icon nzType="edit" (click)="openDrawer(employee)" nz-tooltip="Edit"></span>
            </ng-template>
            <ng-template #actionDelete>
              <span nz-icon nzType="delete" class="delete-icon" (click)="deleteEmployee(employee.id)"
                nz-tooltip="Delete"></span>
            </ng-template>
          </nz-card>
        </nz-list-item>
      </nz-list>
      <div class="pagination-wrapper" *ngIf="total > 0">
        <nz-pagination [nzPageIndex]="pageIndex + 1" [nzTotal]="total" [nzPageSize]="pageSize"
          (nzPageIndexChange)="onPageChange($event)" (nzPageSizeChange)="onPageSizeChange($event)"
          [nzPageSizeOptions]="[5,10,20,30,40,50]" nzShowSizeChanger></nz-pagination>
      </div>
    </div>
  </div>

  <nz-drawer [nzVisible]="drawerVisible" nzPlacement="right" [nzWidth]="'min(480px, 100vw)'"
    [nzTitle]="isEditMode ? 'Edit Employee' : 'Add Employee'" (nzOnClose)="closeDrawer()">
    <div class="drawer-content">
      <form nz-form *nzDrawerContent [formGroup]="employeeForm">
        <nz-form-item>
          <nz-form-label nzRequired>Employee ID</nz-form-label>
          <nz-form-control>
            <input nz-input type="number" formControlName="employeeId">
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzRequired>Full Name</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="employeeFullName">
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-label nzRequired>Membership ID</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="membershipId">
          </nz-form-control>
        </nz-form-item>
        <div style="text-align: right; margin-top: 20px;">
          <button nz-button (click)="closeDrawer()">Cancel</button>
          <button nz-button nzType="primary" (click)="submitForm()">Save</button>
        </div>
      </form>
    </div>
  </nz-drawer>
</div>
