
<nz-layout class="app-layout">
  <nz-sider 
    nzCollapsible 
    [(nzCollapsed)]="isCollapsed" 
    [nzTrigger]="null" 
    nzBreakpoint="lg" 
    [nzCollapsedWidth]="80"
  >
    <div class="logo">
      <span *ngIf="!isCollapsed">Financial App</span>
    </div>

    <ul nz-menu nzTheme="dark" nzMode="inline">
  <!-- Dashboard -->
  <li nz-menu-item routerLink="/home/dashboard" routerLinkActive="ant-menu-item-selected">
    <span nz-icon nzType="dashboard"></span>
    <span>Dashboard</span>
  </li>

  <!-- Saving -->
  <li nz-submenu nzTitle="Saving" nzIcon="property-safety">
    <ul>
      <li nz-menu-item routerLink="/home/saving/view" routerLinkActive="ant-menu-item-selected">
        <span>All Savings</span>
      </li>
      <li nz-menu-item routerLink="/home/saving/by-id" routerLinkActive="ant-menu-item-selected">
        <span>Saving by ID</span>
      </li>
      <li nz-menu-item routerLink="/home/saving/import" routerLinkActive="ant-menu-item-selected">
        <span>Import CSV</span>
      </li>
    </ul>
  </li>

  <!-- Loan -->
  <li nz-submenu nzTitle="Loan" nzIcon="account-book">
    <ul>
      <li nz-menu-item routerLink="/home/loan/apply" routerLinkActive="ant-menu-item-selected">
        <span>Apply for Loan</span>
      </li>
      <li nz-menu-item routerLink="/home/loan/schedule" routerLinkActive="ant-menu-item-selected">
        <span>Loan Schedule</span>
      </li>
      <li nz-menu-item routerLink="/home/loan/payment" routerLinkActive="ant-menu-item-selected">
        <span>Make a Payment</span>
      </li>
    </ul>
  </li>

  <!-- Admin -->
  <li nz-submenu nzTitle="Admin" nzIcon="team">
    <ul>
      <li nz-menu-item routerLink="/home/admin/users" routerLinkActive="ant-menu-item-selected">
        <span>Manage Users</span>
      </li>
      <li nz-menu-item routerLink="/home/admin/roles" routerLinkActive="ant-menu-item-selected">
        <span>Manage Roles</span>
      </li>
      <li nz-menu-item routerLink="/home/admin/logs" routerLinkActive="ant-menu-item-selected">
        <span>System Logs</span>
      </li>
    </ul>
  </li>

  <!-- Reports -->
  <li nz-submenu nzTitle="Reports" nzIcon="bar-chart">
    <ul>
      <li nz-menu-item routerLink="/home/reports/savings" routerLinkActive="ant-menu-item-selected">
        <span>Savings Report</span>
      </li>
      <li nz-menu-item routerLink="/home/reports/loans" routerLinkActive="ant-menu-item-selected">
        <span>Loan Report</span>
      </li>
    </ul>
  </li>
</ul>

  </nz-sider>

  <nz-layout>
    
    <nz-header>
      <div class="header-content">
        <span 
          class="trigger" 
          nz-icon 
          [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" 
          (click)="toggleCollapsed()"
        ></span>
        
       <div class="user-info" nz-dropdown [nzDropdownMenu]="menu">
  <span class="welcome-message">{{ fullName }}</span>
  <span nz-icon nzType="user" nzTheme="outline" class="user-icon"></span>
</div>

<nz-dropdown-menu #menu="nzDropdownMenu">
  <ul nz-menu>
    <li nz-menu-item (click)="logOut()">
      <span nz-icon nzType="logout" nzTheme="outline"></span> Logout
    </li>
  </ul>
</nz-dropdown-menu>

      </div>
    </nz-header>
    
    <nz-content>
      <div class="inner-content">

        <router-outlet></router-outlet>

      </div>
    </nz-content>

    <nz-footer>
      Enat Bank @2025
    </nz-footer>
  </nz-layout>
</nz-layout>
