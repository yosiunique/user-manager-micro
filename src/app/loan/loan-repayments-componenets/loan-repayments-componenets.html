<div *ngIf="haveRole('loan')">


  <div class="toolbar">
    <div class="toolbar-left">
      <button nz-button nzType="primary" (click)="createLoanRepayments()">
        <i nz-icon nzType="plus" nzTheme="outline"></i>
        New Loan Repayment
      </button>
    </div>

    <div class="toolbar-center">
      <input nz-input placeholder="Search Employee ID" [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange($event)"
        class="search-input" />
    </div>

    <div class="toolbar-right">
      <button nz-button nzType="primary" [nzLoading]="uploading" (click)="uploadFile()">
        <i nz-icon nzType="upload"></i> Upload CSV
      </button>

      <button nz-button nzType="default" (click)="reloadPage()">
        <i nz-icon nzType="reload"></i> Refresh
      </button>
    </div>
  </div>

  <div class="loan-cards-container">
    <nz-list [nzLoading]="loading" [nzGrid]="{ gutter: 16, xs: 24, sm: 12, md: 8, lg: 6, xl: 4 }">
      <nz-list-item *ngFor="let l of loan">
        <nz-card [nzBordered]="true" class="loan-card" [nzActions]="[actionDetails]">
          <nz-card-meta [nzAvatar]="avatarTemplate" [nzTitle]="l.employee.employeeFullName"
            [nzDescription]="'Repayment ID: ' + l.id"></nz-card-meta>

          <div class="card-extra-content">
            <div class="info-row">
              <span class="label">Employee ID:</span>
              <span class="value">{{ l.employee.id }}</span>
            </div>
            <div class="info-row">
              <span class="label">Month:</span>
              <span class="value">{{ l.forMonth }}</span>
            </div>
            <div class="info-row highlight">
              <span class="label">Principal:</span>
              <span class="value">{{ l.principal | number }} ETB</span>
            </div>
            <div class="info-row highlight">
              <span class="label">Interest:</span>
              <span class="value">{{ l.interset | number }} ETB</span>
            </div>
          </div>

          <ng-template #avatarTemplate>
            <nz-avatar [nzIcon]="'transaction'" class="loan-avatar"></nz-avatar>
          </ng-template>

          <ng-template #actionDetails>
            <button nz-button nzType="link" (click)="getLoanRepaymentgById(l.employee.id)">
              <i nz-icon nzType="eye"></i> View Details
            </button>
          </ng-template>
        </nz-card>
      </nz-list-item>
    </nz-list>

    <div class="pagination-wrapper" *ngIf="total > 0">
      <nz-pagination [nzPageIndex]="pageIndex + 1" [nzTotal]="total" [nzPageSize]="pageSize"
        (nzPageIndexChange)="onPageChange($event)" (nzPageSizeChange)="onPageSizeChange($event)"
        nzShowSizeChanger></nz-pagination>
    </div>
  </div>
</div>
