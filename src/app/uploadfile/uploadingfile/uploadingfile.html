
<div class="upload-container">
  @if (data === 'loan-repayment') {
    <div class="upload-section">
      <h3>Loan Repayments Upload</h3>
      
      <div class="form-group">
        <label>Select Month:</label>
        <nz-date-picker 
          [(ngModel)]="forMonth" 
          nzMode="month" 
          style="width: 100%; margin-top: 8px;"
          [nzPlaceHolder]="'Select month'">
        </nz-date-picker>
      </div>
      
      <div class="form-group">
        <label>Select CSV File:</label>
        <input 
          type="file" 
          accept=".csv" 
          (change)="handleChange($event)" 
          style="margin-top: 8px; display: block;"
          [disabled]="uploading"
        >
      </div>

      <div class="action-buttons">
        <button 
          nz-button 
          nzType="primary" 
          nzSize="small" 
          [nzLoading]="uploading" 
          (click)="uploadFileLoan()" 
          [disabled]="!forMonth || !selectedFile || uploading"
        >
          <i nz-icon nzType="upload"></i> Upload CSV
        </button>

        <button 
          nz-button 
          nzType="default" 
          nzSize="small" 
          (click)="reloadPage()"
          [disabled]="uploading"
        >
          <i nz-icon nzType="reload"></i> Close
        </button>
      </div>
    </div>
  } @else if (data === 'saving') {
      <div class="upload-section">
      <h3>Loan Repayments Upload</h3>
      
      <div class="form-group">
        <label>Select Month:</label>
        <nz-date-picker 
          [(ngModel)]="forMonth" 
          nzMode="month" 
          style="width: 100%; margin-top: 8px;"
          [nzPlaceHolder]="'Select month'">
        </nz-date-picker>
      </div>
      
      <div class="form-group">
        <label>Select CSV File:</label>
        <input 
          type="file" 
          accept=".csv" 
          (change)="handleChange($event)" 
          style="margin-top: 8px; display: block;"
          [disabled]="uploading"
        >
      </div>

      <div class="action-buttons">
        <button 
          nz-button 
          nzType="primary" 
          nzSize="small" 
          [nzLoading]="uploading" 
          (click)="uploadFile()" 
          [disabled]="!forMonth || !selectedFile || uploading"
        >
          <i nz-icon nzType="upload"></i> Upload CSV
        </button>

        <button 
          nz-button 
          nzType="default" 
          nzSize="small" 
          (click)="reloadPage()"
          [disabled]="uploading"
        >
          <i nz-icon nzType="reload"></i> Close
        </button>
      </div>
    </div>
    }
</div>
